<header class="app-header">
  <div class="header-left">
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" type="button" aria-label="Toggle menu">
      <i class="bi bi-list"></i>
    </button>
    <h1 class="page-title">{% block header_title %}{% endblock %}</h1>
  </div>

  <div class="header-right">
    <div class="dropdown">
      <button class="header-icon-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-bell"></i>
        {% if unread_notification_count %}
          <span class="notif-badge">{{ unread_notification_count if unread_notification_count < 10 else '9+' }}</span>
        {% endif %}
      </button>
      <div class="dropdown-menu dropdown-menu-end shadow-sm" style="width: 320px;">
        <div class="d-flex justify-content-between align-items-center px-3 py-2">
          <span class="fw-semibold small">Notifications</span>
          {% if unread_notification_count %}
          <form method="post" action="{{ url_for('notifications.mark_all_read') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-link btn-sm p-0" type="submit">Mark all read</button>
          </form>
          {% endif %}
        </div>
        <hr class="my-0">
        <a class="dropdown-item small py-2" href="{{ url_for('notifications.list_notifications') }}">
          <i class="bi bi-inbox me-1"></i> View all notifications
        </a>
      </div>
    </div>

    <div class="dropdown">
      <button class="btn d-flex align-items-center gap-2 border-0" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <span class="avatar-circle">{{ current_user.full_name[:1] | upper }}</span>
        <span class="d-none d-md-flex flex-column text-start">
          <span class="small fw-semibold text-dark">{{ current_user.full_name }}</span>
          <span class="small text-muted" style="font-size:0.72rem;">{{ current_user.role | role_label }}</span>
        </span>
      </button>
      <ul class="dropdown-menu dropdown-menu-end shadow-sm">
        <li><a class="dropdown-item" href="{{ url_for('auth.profile') }}"><i class="bi bi-person-gear me-2"></i>My Profile</a></li>
        <li><hr class="dropdown-divider"></li>
        <li>
          <a class="dropdown-item text-danger" href="{{ url_for('auth.logout') }}"><i class="bi bi-box-arrow-right me-2"></i>Logout</a>
        </li>
      </ul>
    </div>
  </div>
</header>
